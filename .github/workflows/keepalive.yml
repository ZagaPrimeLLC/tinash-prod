name: Keep Supabase awake

# Supabase's free plan pauses a project after 7 days with no activity, which
# would take the CRM and careers listings down. A daily read keeps it active.
# Uses only the public key and the public job listing (read-only).
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read published jobs
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/job_posts?select=id&limit=1" \
            -H "apikey: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Accept-Profile: ${{ vars.NEXT_PUBLIC_SUPABASE_SCHEMA }}")
          echo "supabase -> $code"; [ "$code" = 200 ]
